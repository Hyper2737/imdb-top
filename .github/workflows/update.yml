
name: Update IMDb top
on:
  schedule:
    - cron: '0 3 * * *'     # كل يوم الساعة 3 الفجر UTC
  workflow_dispatch:         # يتيح لك تشغيله يدوياً من زر Run workflow
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-imdb-top.mjs
      - run: |
          git config user.name "imdb-bot"
          git config user.email "imdb-bot@users.noreply.github.com"
          git add public/imdb-top.json
          git commit -m "update imdb top" || exit 0
          git push
 
